name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run protocol
      - run: npm run format:check
      - run: npm run schemas && git diff --exit-code -- src/generated
      - run: npm run check
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy 2>&1 | tee deploy.log
      - name: Smoke test the deployment
        if: always() && !cancelled()
        run: |
          set -uo pipefail
          url=$(grep -oE 'https://[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev' deploy.log | tail -1 || true)
          if [ -z "$url" ]; then
            echo "No deployment URL in the wrangler output; nothing was verified." >&2
            exit 1
          fi
          echo "Deployed host: $url"
          code=000
          for _ in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/healthz" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "GET /healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "Health check did not return 200." >&2
            exit 1
          fi
          caps=$(curl -sf "$url/v1/capabilities" || true)
          echo "$caps"
          for needle in '"protocol_version":1' 'rtc_control_ws_v1' 'cold_standby_v1' 'test_call_v1'; do
            if ! printf '%s' "$caps" | grep -q "$needle"; then
              echo "Capabilities response is missing $needle." >&2
              exit 1
            fi
          done
          echo "Deployment verified at $url"
