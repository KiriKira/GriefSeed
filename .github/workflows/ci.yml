name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run protocol
      - run: npm run format:check
      - run: npm run schemas && git diff --exit-code -- src/generated
      - run: npm run check
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
